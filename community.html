<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区 - Dreaming Polar</title>
  <link rel="icon" href="assets/app_logo/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #13233a;
      --muted: #5c6f88;
      --line: #d9e2ee;
      --surface-2: #ffffff;
      --border: #d9e2ee;
      --border-strong: #c3d2e5;
      --brand: #1f6fff;
      --brand-soft: #e8f0ff;
      --pill: #eef4ff;
      --shadow: 0 10px 30px rgba(14, 33, 66, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 100% -10%, #d9ecff 0%, rgba(217, 236, 255, 0) 60%),
        radial-gradient(900px 400px at -10% 0%, #e8f8ff 0%, rgba(232, 248, 255, 0) 55%),
        var(--bg);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }

    .logo img {
      height: 30px;
      width: auto;
    }

    .search-wrap {
      flex: 1;
      position: relative;
      max-width: 760px;
    }

    .search-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #7e91ab;
      font-size: 16px;
    }

    #search-input {
      width: 100%;
      padding: 11px 14px 11px 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    #search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(31, 111, 255, 0.12);
    }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .user-chip {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .container {
      width: min(1240px, 100% - 28px);
      margin: 20px auto 40px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      min-height: 48px;
      background: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .filter-sep {
      width: 0.5px;
      height: 20px;
      background: var(--border-strong);
      flex-shrink: 0;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .filter-tags {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .pill.active {
      background: var(--brand-soft);
      border-color: #bdd3ff;
      color: var(--brand);
      font-weight: 600;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
      user-select: none;
      flex-shrink: 0;
    }

    .tag.active {
      background: var(--brand-soft);
      border-color: #bdd3ff;
      color: var(--brand);
      font-weight: 600;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 330px;
    }

    .cover {
      height: 150px;
      width: 100%;
      object-fit: cover;
      display: block;
      background: linear-gradient(140deg, #d6e7ff 0%, #f4ddff 50%, #d0fff8 100%);
    }

    .content {
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      height: 100%;
    }

    .title {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      min-height: 46px;
    }

    .author {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e7eef8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #405b7e;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 40px;
    }

    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 26px;
    }

    .badge {
      font-size: 12px;
      color: #365980;
      background: var(--pill);
      border: 1px solid #d7e5ff;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .meta {
      margin-top: auto;
      color: #6c7f97;
      font-size: 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      border-top: 1px dashed #dbe5f1;
      padding-top: 10px;
    }

    .meta span { display: inline-flex; align-items: center; gap: 4px; }

    .state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }

    @media (max-width: 1024px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 740px) {
      .topbar { flex-wrap: wrap; }
      .search-wrap { order: 3; width: 100%; max-width: none; }
      .cards { grid-template-columns: 1fr; }
      .container { width: min(1240px, 100% - 18px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">
      <img src="assets/home_page/imgs/dp_logo.png" alt="Dreaming Polar">
      <span>社区</span>
    </a>

    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input id="search-input" type="search" placeholder="搜索教程标题、摘要、作者、标签...">
    </div>

    <div class="top-actions">
      <a class="btn btn-primary" href="/write"><i class="ti ti-pencil-plus"></i>写教程</a>
      <a id="login-btn" class="btn" href="/landing.html">登录</a>
      <a id="avatar-btn" class="user-chip" href="/" style="display:none;"></a>
    </div>
  </header>

  <main class="container">
    <section class="filter-bar">
      <div class="filter-tabs" id="main-filters">
        <button class="pill active" data-filter="all">全部</button>
        <button class="pill" data-filter="latest">最新</button>
        <button class="pill" data-filter="hot">热门</button>
        <button class="pill" data-filter="favorites">我的收藏</button>
      </div>
      <div class="filter-sep"></div>
      <div class="filter-tags" id="tag-filters">
        <button class="tag" data-tag="Python">Python</button>
        <button class="tag" data-tag="数据分析">数据分析</button>
        <button class="tag" data-tag="可视化">可视化</button>
        <button class="tag" data-tag="机器学习">机器学习</button>
        <button class="tag" data-tag="LaTeX">LaTeX</button>
        <button class="tag" data-tag="入门">入门</button>
      </div>
    </section>

    <section id="cards" class="cards"></section>
    <div id="state" class="state" style="display:none;"></div>
  </main>

  <script>
    const tutorialsState = {
      all: [],
      keyword: '',
      mode: 'all',
      tag: null,
      favs: new Set(),
    };

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatDate(v) {
      if (!v) return '刚刚';
      const d = new Date(typeof v === 'number' && v < 1e12 ? v * 1000 : v);
      if (Number.isNaN(d.getTime())) return '刚刚';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function toNum(v) {
      const n = Number(v ?? 0);
      return Number.isFinite(n) ? n : 0;
    }

    function tutorialCover(t) {
      return t.cover_url || t.cover || t.coverUrl || '';
    }

    function tutorialTitle(t) {
      return t.title || t.name || '未命名教程';
    }

    function tutorialSummary(t) {
      return t.summary || t.excerpt || t.description || '暂无摘要';
    }

    function tutorialTags(t) {
      if (Array.isArray(t.tags)) return t.tags;
      if (typeof t.tags === 'string') return t.tags.split(',').map(x => x.trim()).filter(Boolean);
      return [];
    }

    function tutorialAuthor(t) {
      return t.author_name || t.username || t.author?.username || '匿名作者';
    }

    function tutorialAuthorUsername(t) {
      return t.author_username || t.username || t.author?.username || '';
    }

    function tutorialAuthorAvatar(t) {
      return t.author_avatar || t.avatar_url || t.author?.avatar || '';
    }

    function tutorialStats(t) {
      return {
        likes: toNum(t.likes_count ?? t.likes),
        views: toNum(t.views_count ?? t.views),
        ts: toNum(t.published_at ?? t.created_at ?? t.updated_at ?? Date.now()),
      };
    }

    function initials(name) {
      return String(name || '?').trim().slice(0, 2).toUpperCase() || '?';
    }

    function setState(msg, show) {
      const el = document.getElementById('state');
      el.textContent = msg || '';
      el.style.display = show ? '' : 'none';
    }

    function cardHtml(t) {
      const title = tutorialTitle(t);
      const summary = tutorialSummary(t);
      const tags = tutorialTags(t).slice(0, 5);
      const author = tutorialAuthor(t);
      const authorUsername = tutorialAuthorUsername(t);
      const avatar = tutorialAuthorAvatar(t);
      const cover = tutorialCover(t);
      const stats = tutorialStats(t);

      const badgeHtml = tags.length
        ? tags.map(tag => `<span class="badge">${esc(tag)}</span>`).join('')
        : '<span class="badge">未分类</span>';

      const avatarHtml = avatar
        ? `<span class="avatar"><img src="${esc(avatar)}" alt="${esc(author)}"></span>`
        : `<span class="avatar">${esc(initials(author))}</span>`;

      const authorLink = authorUsername
        ? `/community/user/${encodeURIComponent(authorUsername)}`
        : '#';

      const coverHtml = cover
        ? `<img class="cover" src="${esc(cover)}" alt="${esc(title)}">`
        : '<div class="cover"></div>';

      return `
        <article class="card">
          ${coverHtml}
          <div class="content">
            <h3 class="title">${esc(title)}</h3>
            <a class="author" href="${authorLink}">${avatarHtml}<span>${esc(author)}</span></a>
            <p class="summary">${esc(summary)}</p>
            <div class="badge-list">${badgeHtml}</div>
            <div class="meta">
              <span><i class="ti ti-heart"></i>${stats.likes}</span>
              <span><i class="ti ti-eye"></i>${stats.views}</span>
              <span><i class="ti ti-clock"></i>${formatDate(stats.ts)}</span>
            </div>
          </div>
        </article>
      `;
    }

    function applyFilters() {
      const k = tutorialsState.keyword.trim().toLowerCase();
      let items = [...tutorialsState.all];

      if (k) {
        items = items.filter(t => {
          const tags = tutorialTags(t).join(' ');
          const text = `${tutorialTitle(t)} ${tutorialSummary(t)} ${tutorialAuthor(t)} ${tags}`.toLowerCase();
          return text.includes(k);
        });
      }

      if (tutorialsState.tag) {
        items = items.filter(t => tutorialTags(t).some(tag => String(tag).toLowerCase() === tutorialsState.tag.toLowerCase()));
      }

      if (tutorialsState.mode === 'latest') {
        items.sort((a, b) => tutorialStats(b).ts - tutorialStats(a).ts);
      } else if (tutorialsState.mode === 'hot') {
        items.sort((a, b) => (tutorialStats(b).likes + tutorialStats(b).views) - (tutorialStats(a).likes + tutorialStats(a).views));
      } else if (tutorialsState.mode === 'favorites') {
        items = items.filter(t => tutorialsState.favs.has(String(t.id ?? t.tutorial_id ?? '')));
      }

      const cards = document.getElementById('cards');
      if (!items.length) {
        cards.innerHTML = '';
        setState('暂无符合条件的教程', true);
        return;
      }

      setState('', false);
      cards.innerHTML = items.map(cardHtml).join('');
    }

    function setupUserArea() {
      let user = null;
      try { user = JSON.parse(localStorage.getItem('dp-auth-user') || 'null'); } catch (_) {}
      const loginBtn = document.getElementById('login-btn');
      const avatarBtn = document.getElementById('avatar-btn');

      let username = '';
      try {
        username = window.authClient?.getUser?.()?.username
          ?? JSON.parse(localStorage.getItem('dp-auth-user') || '{}')?.username
          ?? '';
      } catch (_) {}

      if (username) {
        avatarBtn.href = `/community/user/${encodeURIComponent(username)}`;
        avatarBtn.onclick = null;
      } else {
        avatarBtn.href = '/';
      }

      if (user && user.username) {
        loginBtn.style.display = 'none';
        avatarBtn.style.display = '';
        avatarBtn.title = user.username;
        if (user.avatar) {
          avatarBtn.innerHTML = `<img src="${esc(user.avatar)}" alt="${esc(user.username)}" style="width:100%;height:100%;object-fit:cover;border-radius:999px;">`;
        } else {
          avatarBtn.textContent = initials(user.username);
        }
      }
    }

    function hasLoginSession() {
      if (window.authClient?.isLoggedIn?.()) return true;
      if (/(?:^|;\s*)(?:accessToken|dp_access)=/.test(document.cookie || '')) return true;
      return Boolean(
        localStorage.getItem('dp-access-token') ||
        localStorage.getItem('accessToken') ||
        localStorage.getItem('token') ||
        localStorage.getItem('dp-token')
      );
    }

    function bindFilters() {
      document.getElementById('main-filters').addEventListener('click', (e) => {
        const btn = e.target.closest('.pill[data-filter]');
        if (!btn) return;
        if (btn.dataset.filter === 'favorites' && !hasLoginSession()) {
          alert('请先登录查看收藏');
          return;
        }
        tutorialsState.mode = btn.dataset.filter;
        document.querySelectorAll('#main-filters .pill').forEach(x => x.classList.toggle('active', x === btn));
        applyFilters();
      });

      document.getElementById('tag-filters').addEventListener('click', (e) => {
        const btn = e.target.closest('.tag[data-tag]');
        if (!btn) return;
        const selected = btn.dataset.tag;
        tutorialsState.tag = tutorialsState.tag === selected ? null : selected;
        document.querySelectorAll('#tag-filters .tag').forEach(x => x.classList.toggle('active', x === btn && tutorialsState.tag === selected));
        applyFilters();
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        tutorialsState.keyword = e.target.value || '';
        applyFilters();
      });
    }

    async function loadTutorials() {
      setState('正在加载社区教程...', true);
      try {
        const resp = await fetch('https://api.dreamingpolar.com/auth/tutorials?status=published', { credentials: 'include' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        tutorialsState.all = Array.isArray(data) ? data : (Array.isArray(data?.items) ? data.items : []);
      } catch (err) {
        console.error('[community] load tutorials failed', err);
        tutorialsState.all = [];
      }
      applyFilters();
      if (!tutorialsState.all.length) setState('还没有可展示的已发布教程', true);
    }

    function loadFavorites() {
      try {
        const v = JSON.parse(localStorage.getItem('dp-favorite-tutorials') || '[]');
        tutorialsState.favs = new Set(Array.isArray(v) ? v.map(x => String(x)) : []);
      } catch (_) {
        tutorialsState.favs = new Set();
      }
    }

    setupUserArea();
    bindFilters();
    loadFavorites();
    loadTutorials();
  </script>
</body>
</html>
