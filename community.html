<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区 - Dreaming Polar</title>
  <link rel="icon" href="assets/app_logo/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/components/auth/auth_ui.css">
  <link rel="stylesheet" href="/components/pages/community/community.css">
  <script type="module">
    import { initAuth } from '/components/auth/auth_client.js';
    initAuth().finally(() => {
      document.dispatchEvent(new CustomEvent('auth-ready'));
    });
  </script>
</head>
<body>
<script>if(/Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){window.location.replace('/mobile');}</script>
  <header class="topbar">
    <a class="logo" href="/" title="返回应用内" aria-label="返回应用内">
      <img src="assets/home_page/imgs/dp_logo.png" alt="Dreaming Polar">
      <span class="logo-back-hint" aria-hidden="true"><i class="ti ti-arrow-left"></i></span>
    </a>

    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input id="search-input" type="search" placeholder="搜索教程标题、摘要、作者、标签...">
    </div>

    <div class="top-actions">
      <a class="btn btn-primary" href="/write"><i class="ti ti-pencil-plus"></i>写教程</a>
      <a id="login-btn" class="btn" href="/landing.html">登录</a>
      <a id="avatar-btn" class="user-chip" href="/" style="display:none;"></a>
    </div>
  </header>

  <main class="container">
    <section class="filter-bar">
      <div class="filter-tabs" id="main-filters">
        <button class="pill active" data-filter="all">全部</button>
        <button class="pill" data-filter="latest">最新</button>
        <button class="pill" data-filter="hot">热门</button>
        <button class="pill" data-filter="favorites">我的收藏</button>
      </div>
      <div class="filter-sep"></div>
      <div class="filter-tags" id="tag-filters">
        <button class="tag" data-tag="Python">Python</button>
        <button class="tag" data-tag="数据分析">数据分析</button>
        <button class="tag" data-tag="可视化">可视化</button>
        <button class="tag" data-tag="机器学习">机器学习</button>
        <button class="tag" data-tag="LaTeX">LaTeX</button>
        <button class="tag" data-tag="入门">入门</button>
      </div>
    </section>

    <section id="cards" class="cards"></section>
    <div id="state" class="state" style="display:none;"></div>
  </main>

  <script src="/components/pages/community/community.js"></script>
</body>
</html>
