<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户主页 - Dreaming Polar</title>
  <link rel="icon" href="assets/app_logo/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/components/profile_page/profile.css">
  <link rel="stylesheet" href="/components/auth/auth_screen.css">
  <link rel="stylesheet" href="/components/auth/auth_ui.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="top-left">
        <a class="logo" href="/community">
          <img src="assets/home_page/imgs/dp_logo.png" alt="Dreaming Polar">
          <span>DREAMING POLAR</span>
        </a>
        <a class="back-link" href="/community"><i class="ti ti-arrow-left"></i> 社区</a>
      </div>
      <div class="top-actions">
        <a class="btn btn-primary" href="/write"><i class="ti ti-pencil-plus"></i>写教程</a>
        <a class="avatar-chip" id="top-avatar" href="/" title="个人主页"></a>
      </div>
    </div>
  </header>

  <main class="page">
    <aside class="sidebar">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <h1 class="name" id="profile-name">加载中...</h1>
      <p class="handle" id="profile-handle"></p>
      <p class="bio" id="profile-bio">正在获取用户信息...</p>

      <section class="stats">
        <div>
          <div class="stat-number" id="stat-tutorials">0</div>
          <div class="stat-label">教程</div>
        </div>
        <div>
          <div class="stat-number" id="stat-likes">0</div>
          <div class="stat-label">获赞</div>
        </div>
        <div>
          <div class="stat-number" id="stat-views">0</div>
          <div class="stat-label">浏览</div>
        </div>
      </section>

      <section class="follow-group" id="follow-group" style="display:none;">
        <button class="btn" type="button" id="follow-btn">+ 关注</button>
      </section>

      <h3 class="tag-title">擅长领域</h3>
      <div class="tag-list" id="skill-tags"></div>
    </aside>

    <section class="main">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="published">发布的教程</button>
        <button class="tab-btn" data-tab="favorites">收藏</button>
        <button class="tab-btn" data-tab="likes">点赞</button>
      </div>

      <div class="list" id="list"></div>
      <div class="state" id="state" style="display:none;"></div>
    </section>
  </main>

  <script type="module" src="/components/profile_page/profile.js"></script>
</body>
</html>
