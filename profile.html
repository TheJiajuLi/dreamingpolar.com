<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户主页 - Dreaming Polar</title>
  <link rel="icon" href="assets/app_logo/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script type="module">
    import { initAuth } from '/components/auth/auth_client.js';
    initAuth().catch(() => {});
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2329;
      --muted: #6b7280;
      --line: #e8ebf0;
      --brand: #5a63f2;
      --brand-soft: #eff1ff;
      --card: #ffffff;
      --shadow: 0 8px 20px rgba(18, 24, 36, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(1220px, 100% - 36px);
      margin: 0 auto;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .top-left {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    .logo img {
      width: 26px;
      height: 26px;
    }

    .back-link {
      color: #586274;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .back-link:hover { background: #f4f6fb; }

    .top-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: #fff;
      border-color: #d4d9e5;
    }

    .avatar-chip {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #42506a;
      background: #f4f7ff;
      text-decoration: none;
      font-weight: 700;
    }

    .avatar-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .page {
      width: min(1220px, 100% - 36px);
      margin: 20px auto 34px;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 26px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 90px;
      border-right: 1px solid var(--line);
      padding-right: 18px;
      min-height: calc(100vh - 120px);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 999px;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, #5863f1, #7078ff);
      color: #fff;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name {
      margin: 0;
      font-size: 36px;
      line-height: 1.2;
    }

    .handle {
      margin: 4px 0 10px;
      color: #7d8798;
      font-size: 18px;
    }

    .bio {
      margin: 0;
      color: #3f4653;
      font-size: 18px;
      line-height: 1.55;
      min-height: 52px;
    }

    .stats {
      margin: 18px 0 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      padding: 16px 2px;
      gap: 6px;
    }

    .stat-number {
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
      color: #111827;
    }

    .stat-label {
      margin-top: 6px;
      color: #7b8596;
      font-size: 14px;
    }

    .follow-group {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag-title {
      margin: 16px 0 8px;
      color: #8b95a6;
      font-size: 14px;
      font-weight: 600;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 4px 12px;
      border-radius: 999px;
      background: #f1f3ff;
      color: #4958f0;
      font-size: 20px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .main {
      min-width: 0;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .tab-btn {
      border: 0;
      background: none;
      color: #6f7889;
      padding: 12px 0;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 16px;
      padding-bottom: 26px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
    }

    .card-cover {
      width: 100%;
      height: 116px;
      border-radius: 12px;
      background: linear-gradient(145deg, #e4e8fb, #eaf4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b98d9;
      overflow: hidden;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      min-width: 0;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      color: #5868f5;
      background: #f2f4ff;
      border: 1px solid #e2e7ff;
    }

    .card-title {
      margin: 0;
      font-size: 36px;
      line-height: 1.28;
      color: #1f2430;
    }

    .card-summary {
      margin: 0;
      color: #666f7f;
      font-size: 28px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #7a8496;
      font-size: 14px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .card-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .state {
      border: 1px dashed #d8deea;
      border-radius: 14px;
      padding: 24px;
      color: #7c8799;
      text-align: center;
      font-size: 16px;
    }

    @media (max-width: 1024px) {
      .page {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding-right: 0;
        padding-bottom: 16px;
        min-height: auto;
      }

      .name { font-size: 32px; }
      .bio { font-size: 16px; }
      .tab-btn { font-size: 28px; }
      .card-title { font-size: 28px; }
      .card-summary { font-size: 22px; }
    }

    @media (max-width: 700px) {
      .topbar-inner,
      .page { width: calc(100% - 20px); }

      .card {
        grid-template-columns: 1fr;
      }

      .card-cover {
        height: 168px;
      }

      .name { font-size: 28px; }
      .stat-number { font-size: 28px; }
      .tab-btn { font-size: 22px; }
      .card-title { font-size: 24px; }
      .card-summary { font-size: 18px; }
      .tag { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="top-left">
        <a class="logo" href="/community">
          <img src="assets/home_page/imgs/dp_logo.png" alt="Dreaming Polar">
          <span>DREAMING POLAR</span>
        </a>
        <a class="back-link" href="/community"><i class="ti ti-arrow-left"></i> 社区</a>
      </div>
      <div class="top-actions">
        <a class="btn btn-primary" href="/write"><i class="ti ti-pencil-plus"></i>写教程</a>
        <a class="avatar-chip" id="top-avatar" href="/" title="个人主页"></a>
      </div>
    </div>
  </header>

  <main class="page">
    <aside class="sidebar">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <h1 class="name" id="profile-name">加载中...</h1>
      <p class="handle" id="profile-handle"></p>
      <p class="bio" id="profile-bio">正在获取用户信息...</p>

      <section class="stats">
        <div>
          <div class="stat-number" id="stat-tutorials">0</div>
          <div class="stat-label">教程</div>
        </div>
        <div>
          <div class="stat-number" id="stat-likes">0</div>
          <div class="stat-label">获赞</div>
        </div>
        <div>
          <div class="stat-number" id="stat-views">0</div>
          <div class="stat-label">浏览</div>
        </div>
      </section>

      <section class="follow-group" id="follow-group" style="display:none;">
        <button class="btn" type="button" id="follow-btn">+ 关注</button>
      </section>

      <h3 class="tag-title">擅长领域</h3>
      <div class="tag-list" id="skill-tags"></div>
    </aside>

    <section class="main">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="published">发布的教程</button>
        <button class="tab-btn" data-tab="favorites">收藏</button>
        <button class="tab-btn" data-tab="likes">点赞</button>
      </div>

      <div class="list" id="list"></div>
      <div class="state" id="state" style="display:none;"></div>
    </section>
  </main>

  <script>
    const username = location.pathname.split('/community/user/')[1];
    if (!username) location.href = '/community';

    const state = {
      username: decodeURIComponent(username),
      profile: null,
      tutorials: {
        published: [],
        favorites: [],
        likes: [],
      },
      currentTab: 'published',
      me: null,
    };

    const els = {
      topAvatar: document.getElementById('top-avatar'),
      profileAvatar: document.getElementById('profile-avatar'),
      profileName: document.getElementById('profile-name'),
      profileHandle: document.getElementById('profile-handle'),
      profileBio: document.getElementById('profile-bio'),
      statTutorials: document.getElementById('stat-tutorials'),
      statLikes: document.getElementById('stat-likes'),
      statViews: document.getElementById('stat-views'),
      followGroup: document.getElementById('follow-group'),
      skillTags: document.getElementById('skill-tags'),
      tabs: document.getElementById('tabs'),
      list: document.getElementById('list'),
      state: document.getElementById('state'),
    };

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function initials(name) {
      const v = String(name || '?').trim();
      return (v.slice(0, 2) || '?').toUpperCase();
    }

    function toNum(v) {
      const n = Number(v ?? 0);
      return Number.isFinite(n) ? n : 0;
    }

    function formatNum(v) {
      const n = toNum(v);
      if (n >= 1000) return `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k`;
      return String(n);
    }

    function formatDate(v) {
      if (!v) return '刚刚';
      const d = new Date(typeof v === 'number' && v < 1e12 ? v * 1000 : v);
      if (Number.isNaN(d.getTime())) return '刚刚';
      const diff = Date.now() - d.getTime();
      const day = Math.floor(diff / 86400000);
      if (day <= 0) return '今天';
      if (day < 30) return `${day}天前`;
      const mon = Math.floor(day / 30);
      if (mon < 12) return `${mon}月前`;
      return `${Math.floor(mon / 12)}年前`;
    }

    function tutorialId(t) {
      return String(t.id || t.tutorial_id || t._id || '');
    }

    function tutorialTitle(t) {
      return t.title || t.name || '未命名教程';
    }

    function tutorialSummary(t) {
      return t.summary || t.excerpt || t.description || '暂无摘要';
    }

    function tutorialCover(t) {
      return t.cover_url || t.cover || t.coverUrl || t.cover_image || '';
    }

    function tutorialTags(t) {
      if (Array.isArray(t.tags)) return t.tags.filter(Boolean);
      if (typeof t.tags === 'string') return t.tags.split(',').map(x => x.trim()).filter(Boolean);
      return [];
    }

    function tutorialLikes(t) {
      return toNum(t.likes_count ?? t.likes);
    }

    function tutorialViews(t) {
      return toNum(t.views_count ?? t.views);
    }

    function showState(msg = '', show = false) {
      els.state.textContent = msg;
      els.state.style.display = show ? '' : 'none';
    }

    function getProfileFromTutorial(t) {
      return {
        username: t.author_username || t.username || t.author?.username || state.username,
        name: t.author_name || t.author?.name || t.author_username || t.username || state.username,
        avatar: t.author_avatar || t.avatar_url || t.author?.avatar || '',
        bio: t.author_bio || t.author?.bio || '',
      };
    }

    async function fetchJson(url) {
      const res = await fetch(url, { credentials: 'include' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data?.message || `请求失败: ${res.status}`);
      return data;
    }

    function normalizeList(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.items)) return data.items;
      if (Array.isArray(data?.tutorials)) return data.tutorials;
      if (Array.isArray(data?.data)) return data.data;
      return [];
    }

    async function loadPublishedTutorials() {
      const data = await fetchJson(`https://api.dreamingpolar.com/auth/tutorials?author=${encodeURIComponent(state.username)}&status=published`);
      state.tutorials.published = normalizeList(data);
      return state.tutorials.published;
    }

    async function loadProfileFromApi() {
      try {
        const data = await fetchJson(`https://api.dreamingpolar.com/auth/users/${encodeURIComponent(state.username)}`);
        const user = data?.user || data?.data || data;
        if (!user) throw new Error('empty');
        state.profile = {
          username: user.username || state.username,
          name: user.name || user.username || state.username,
          avatar: user.avatar || user.avatar_url || '',
          bio: user.bio || '',
        };
      } catch (_) {
        const first = state.tutorials.published[0] || null;
        state.profile = first ? getProfileFromTutorial(first) : {
          username: state.username,
          name: state.username,
          avatar: '',
          bio: '',
        };
      }
    }

    async function loadOptionalTab(tab) {
      const plans = {
        favorites: [
          `https://api.dreamingpolar.com/auth/tutorials?favorited_by=${encodeURIComponent(state.username)}`,
          `https://api.dreamingpolar.com/auth/users/${encodeURIComponent(state.username)}/favorites`,
        ],
        likes: [
          `https://api.dreamingpolar.com/auth/tutorials?liked_by=${encodeURIComponent(state.username)}`,
          `https://api.dreamingpolar.com/auth/users/${encodeURIComponent(state.username)}/likes`,
        ],
      };

      const urls = plans[tab] || [];
      for (const url of urls) {
        try {
          const data = await fetchJson(url);
          state.tutorials[tab] = normalizeList(data);
          return;
        } catch (_) {}
      }
      state.tutorials[tab] = [];
    }

    function loadMeFromCache() {
      try {
        const u = JSON.parse(localStorage.getItem('dp-auth-user') || 'null');
        if (u && u.username) state.me = u;
      } catch (_) {}
    }

    function renderTopAvatar() {
      if (state.me?.avatar) {
        els.topAvatar.innerHTML = `<img src="${esc(state.me.avatar)}" alt="${esc(state.me.username)}">`;
      } else {
        const text = state.me?.username ? initials(state.me.username) : '我';
        els.topAvatar.textContent = text;
      }
    }

    function calcStats(list) {
      const tutorials = list.length;
      const likes = list.reduce((sum, t) => sum + tutorialLikes(t), 0);
      const views = list.reduce((sum, t) => sum + tutorialViews(t), 0);
      return { tutorials, likes, views };
    }

    function calcSkills(list) {
      const map = new Map();
      list.forEach((t) => {
        tutorialTags(t).forEach((tag) => {
          map.set(tag, (map.get(tag) || 0) + 1);
        });
      });
      return [...map.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .map(([name]) => name);
    }

    function renderSidebar() {
      const p = state.profile || { username: state.username, name: state.username, avatar: '', bio: '' };

      if (p.avatar) {
        els.profileAvatar.innerHTML = `<img src="${esc(p.avatar)}" alt="${esc(p.name)}">`;
      } else {
        els.profileAvatar.textContent = initials(p.name);
      }
      els.profileName.textContent = p.name || state.username;
      els.profileHandle.textContent = `@${p.username || state.username}`;
      els.profileBio.textContent = p.bio || '这个人很神秘，还没有填写简介。';

      const stats = calcStats(state.tutorials.published);
      els.statTutorials.textContent = formatNum(stats.tutorials);
      els.statLikes.textContent = formatNum(stats.likes);
      els.statViews.textContent = formatNum(stats.views);

      const isSelf = state.me?.username && state.me.username === (p.username || state.username);
      els.followGroup.style.display = isSelf ? 'none' : '';

      const skills = calcSkills(state.tutorials.published);
      if (!skills.length) {
        els.skillTags.innerHTML = '<span class="tag">暂无</span>';
      } else {
        els.skillTags.innerHTML = skills.map((tag) => `<span class="tag">${esc(tag)}</span>`).join('');
      }
    }

    function cardHtml(t) {
      const title = tutorialTitle(t);
      const summary = tutorialSummary(t);
      const tags = tutorialTags(t).slice(0, 3);
      const likes = tutorialLikes(t);
      const views = tutorialViews(t);
      const time = formatDate(t.published_at || t.created_at || t.updated_at || Date.now());
      const cover = tutorialCover(t);
      const id = tutorialId(t);
      const href = id ? `/community/${encodeURIComponent(id)}` : '/community';

      return `
        <a class="card" href="${href}">
          <div class="card-cover">${cover ? `<img src="${esc(cover)}" alt="${esc(title)}">` : '<i class="ti ti-chart-line" style="font-size:36px;"></i>'}</div>
          <div class="card-body">
            <div class="badge-row">${tags.length ? tags.map(tag => `<span class="badge">${esc(tag)}</span>`).join('') : '<span class="badge">未分类</span>'}</div>
            <h3 class="card-title">${esc(title)}</h3>
            <p class="card-summary">${esc(summary)}</p>
            <div class="card-meta">
              <span><i class="ti ti-heart"></i>${likes}</span>
              <span><i class="ti ti-eye"></i>${views}</span>
              <span><i class="ti ti-clock"></i>${esc(time)}</span>
            </div>
          </div>
        </a>
      `;
    }

    function emptyText(tab) {
      if (tab === 'favorites') return '暂无收藏教程';
      if (tab === 'likes') return '暂无点赞教程';
      return '这个用户还没有发布教程';
    }

    function renderList() {
      const list = state.tutorials[state.currentTab] || [];
      if (!list.length) {
        els.list.innerHTML = '';
        showState(emptyText(state.currentTab), true);
        return;
      }

      showState('', false);
      els.list.innerHTML = list.map(cardHtml).join('');
    }

    function bindTabs() {
      els.tabs.addEventListener('click', async (e) => {
        const btn = e.target.closest('.tab-btn[data-tab]');
        if (!btn) return;

        const tab = btn.dataset.tab;
        if (!tab || tab === state.currentTab) return;

        state.currentTab = tab;
        els.tabs.querySelectorAll('.tab-btn').forEach((x) => x.classList.toggle('active', x === btn));

        if (!state.tutorials[tab] || !state.tutorials[tab].length) {
          showState('加载中...', true);
          if (tab === 'published') {
            await loadPublishedTutorials().catch(() => {});
          } else {
            await loadOptionalTab(tab);
          }
        }
        renderList();
      });
    }

    async function boot() {
      bindTabs();
      loadMeFromCache();
      renderTopAvatar();
      showState('正在加载用户主页...', true);

      try {
        await loadPublishedTutorials();
        await loadProfileFromApi();
        renderSidebar();
        renderList();
      } catch (err) {
        showState(`加载失败：${err.message || '未知错误'}`, true);
      }
    }

    boot();
  </script>
</body>
</html>
