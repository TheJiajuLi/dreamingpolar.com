<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写教程 - Dreaming Polar</title>
  <link rel="icon" href="assets/app_logo/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css">
  <link rel="stylesheet" href="/components/pages/write/write.css">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="/community"><i class="ti ti-arrow-left"></i>返回社区</a>
    <input id="title-input" type="text" placeholder="输入教程标题...">
    <div class="actions">
      <a id="avatar-btn" class="user-chip" href="/" title="个人主页"></a>
      <span id="save-status">未保存</span>
      <button class="btn" id="btn-save" type="button">保存草稿</button>
      <button class="btn" id="btn-update" type="button" style="display:none;">更新</button>
      <button class="btn btn-primary" id="btn-publish" type="button">发布</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel block-tools" aria-label="Block 工具栏">
      <button class="tool-btn" title="文本" data-add="text"><i class="ti ti-align-left"></i></button>
      <button class="tool-btn" title="代码" data-add="code"><i class="ti ti-code"></i></button>
      <button class="tool-btn" title="公式" data-add="latex"><i class="ti ti-math"></i></button>
      <button class="tool-btn" title="图片" data-add="image"><i class="ti ti-photo"></i></button>
      <button class="tool-btn" title="标题" data-add="heading"><i class="ti ti-heading"></i></button>
      <button class="tool-btn" title="提示框" data-add="callout"><i class="ti ti-bulb"></i></button>
    </aside>

    <section class="panel editor">
      <div class="panel-head">编辑区（Block 列表）</div>
      <div class="panel-body" id="editor-scroll">
        <section class="meta-editor">
          <div class="meta-cover">
            <div class="cover-preview" id="cover-preview">无封面</div>
            <div>
              <button class="btn" type="button" id="cover-upload-btn">设置封面图片</button>
              <div style="margin-top:8px;font-size:12px;color:#5f748f;">支持本地上传或 URL。</div>
            </div>
          </div>
          <div class="meta-grid">
            <input id="meta-title" type="text" placeholder="教程标题">
            <textarea id="meta-summary" placeholder="一句话描述这篇教程..."></textarea>
            <div class="tag-picker" id="meta-tags"></div>
          </div>
        </section>

        <section id="block-list"></section>
      </div>
    </section>

    <section class="panel preview">
      <div class="panel-head">预览区</div>
      <div class="panel-body" id="preview-root">
        <div class="preview-placeholder" id="preview-placeholder">
          <strong>实时预览（骨架）</strong><br>
          后续将在这里渲染教程内容，包括文本、代码、公式和图片。
        </div>
        <div class="preview-content" id="preview-content" style="display:none;"></div>
      </div>
    </section>
  </main>

  <div class="modal-layer" id="modal-layer" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot">
        <button class="btn" type="button" id="modal-cancel">取消</button>
        <button class="btn btn-primary" type="button" id="modal-confirm">确认</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="/components/pages/write/write_mathjax_config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>

  <script type="module" src="/components/pages/write/write.js"></script>
</body>
</html>
