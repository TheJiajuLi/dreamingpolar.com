<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教程详情 - Dreaming Polar</title>
  <link rel="icon" href="assets/app_logo/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script type="module">
    import { initAuth } from '/components/auth/auth_client.js';

    initAuth().then(() => {
      if (!window.authClient?.isLoggedIn()) {
        console.warn('[tutorial] 未登录，点赞/评论功能需要先登录');
      }
    });
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #667085;
      --line: #e8edf3;
      --line-strong: #d7e0ea;
      --panel: #ffffff;
      --brand: #1f6fff;
      --brand-soft: #e9f1ff;
      --like: #ef476f;
      --code-bg: #0f1726;
      --shadow: 0 12px 28px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Charter", "Source Han Serif SC", "Noto Serif SC", serif;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(1200px, 100% - 32px);
      margin: 0 auto;
      min-height: 66px;
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 14px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .logo img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      color: #334155;
      background: #f4f7fb;
    }

    .author-inline {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #3f4f66;
      font-size: 13px;
    }

    .author-link {
      text-decoration: none;
      color: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #d8e6ff, #f5ecff);
      border: 1px solid #d7e1ee;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #41516a;
      flex-shrink: 0;
      overflow: hidden;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .like-wrap {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-left: 8px;
    }

    .action-btn {
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      color: #475569;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 86px;
      justify-content: center;
      transition: all 0.16s ease;
    }

    .action-btn:hover { transform: translateY(-1px); }

    .action-btn.liked {
      border-color: #f6b6c5;
      background: #fff2f6;
      color: var(--like);
    }

    .page {
      width: min(1200px, 100% - 32px);
      margin: 28px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 760px) minmax(260px, 340px);
      justify-content: center;
      gap: 34px;
      align-items: start;
    }

    .article {
      min-width: 0;
    }

    .article-title {
      margin: 6px 0 14px;
      font-size: clamp(34px, 4vw, 46px);
      line-height: 1.16;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    .article-summary {
      margin: 0 0 24px;
      color: #475467;
      font-size: 20px;
      line-height: 1.55;
    }

    .article-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .article-cover {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      margin-bottom: 26px;
      display: none;
      object-fit: cover;
      max-height: 460px;
      background: #f8fbff;
    }

    .block-list {
      display: grid;
      gap: 18px;
    }

    .tut-text {
      font-size: 20px;
      line-height: 1.86;
      color: #1f2937;
      overflow-wrap: anywhere;
    }

    .tut-text p { margin: 0 0 1.2em; }
    .tut-text p:last-child { margin-bottom: 0; }
    .tut-text a { color: #0b66d6; text-decoration: underline; }
    .tut-text ul,
    .tut-text ol { padding-left: 1.3em; margin: 0 0 1.1em; }

    .tut-heading {
      margin: 24px 0 8px;
      line-height: 1.3;
      color: #0f172a;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    h2.tut-heading { font-size: 34px; font-weight: 700; }
    h3.tut-heading { font-size: 28px; font-weight: 700; }
    h4.tut-heading { font-size: 24px; font-weight: 650; }

    .tut-code {
      margin: 8px 0;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1d2a3e;
      background: #0d1627;
      box-shadow: 0 12px 22px rgba(15, 23, 38, 0.18);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #111e34;
      border-bottom: 1px solid #24344f;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .lang-badge {
      font-size: 12px;
      color: #cfdbf2;
      border: 1px solid #2c3f5c;
      background: #15263f;
      border-radius: 999px;
      padding: 3px 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .run-btn {
      border: 1px solid #47689b;
      background: #193258;
      color: #d4e4ff;
      border-radius: 8px;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .run-btn:hover { background: #224272; }
    .run-btn[disabled] { opacity: 0.62; cursor: wait; }

    .tut-code pre {
      margin: 0;
      padding: 16px;
      overflow: auto;
      background: var(--code-bg);
    }

    .tut-code code {
      color: #f1f5ff;
      font-size: 13px;
      line-height: 1.58;
      font-family: "Monaco", "Menlo", "JetBrains Mono", monospace;
      white-space: pre;
      display: block;
    }

    .code-output {
      display: none;
      border-top: 1px solid #2c3f5c;
      padding: 12px 14px;
      color: #d8e4f9;
      background: #111c2f;
      font-family: "Monaco", "Menlo", "JetBrains Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .tut-latex {
      padding: 12px 0;
      overflow: auto;
      font-size: 18px;
      color: #0f172a;
    }

    .tut-image {
      margin: 12px auto;
      text-align: center;
    }

    .tut-image img {
      max-width: 100%;
      width: auto;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #f9fbff;
      display: inline-block;
    }

    .tut-image figcaption {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .tut-callout {
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 17px;
      line-height: 1.6;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      border: 1px solid transparent;
    }

    .tut-callout i { margin-top: 2px; }

    .tut-callout--tip {
      background: #edf7ff;
      border-color: #bde0ff;
      color: #0f4f86;
    }

    .tut-callout--warning {
      background: #fff7ed;
      border-color: #ffd9ab;
      color: #8a4b07;
    }

    .tut-callout--info {
      background: #f2f4ff;
      border-color: #c8d3ff;
      color: #3b4db8;
    }

    .sidebar {
      position: sticky;
      top: 86px;
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .author-card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .author-name {
      font-weight: 700;
      font-size: 15px;
    }

    .author-bio {
      margin: 0;
      color: #5c6c84;
      font-size: 13px;
      line-height: 1.6;
    }

    .related-list {
      display: grid;
      gap: 10px;
    }

    .related-item {
      display: block;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      color: #1f2937;
      transition: all 0.16s ease;
    }

    .related-item:hover {
      border-color: #b9cae0;
      background: #f8fbff;
      transform: translateY(-1px);
    }

    .related-title {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.4;
    }

    .related-meta {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .comments {
      width: min(760px, 100% - 32px);
      margin: 34px auto 52px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .comments h2 {
      margin: 0 0 14px;
      font-size: 24px;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .comment-form {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    #comment-input {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 12px;
      outline: none;
      font-size: 14px;
      line-height: 1.55;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    #comment-input:focus {
      border-color: #9db9e0;
      box-shadow: 0 0 0 3px rgba(31, 111, 255, 0.1);
    }

    .comments-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-text {
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .comment-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .comment-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 8px;
      background: #fff;
    }

    .comment-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .comment-user {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .comment-name {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .comment-time {
      font-size: 12px;
      color: #8091a8;
      flex-shrink: 0;
    }

    .comment-content {
      font-size: 15px;
      color: #1f2937;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty-state {
      border: 1px dashed #cfdae7;
      border-radius: 12px;
      padding: 14px;
      color: #7a8da8;
      font-size: 14px;
      text-align: center;
    }

    .error-box {
      width: min(760px, 100% - 32px);
      margin: 40px auto;
      border: 1px solid #f5c2c7;
      color: #7f1d1d;
      background: #fff5f6;
      border-radius: 12px;
      padding: 14px;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: minmax(0, 760px);
      }

      .sidebar {
        position: static;
        order: 2;
      }

      .topbar-inner {
        grid-template-columns: auto 1fr auto;
      }

      .author-inline {
        display: none;
      }
    }

    @media (max-width: 680px) {
      .topbar-inner {
        width: calc(100% - 20px);
        min-height: 58px;
        gap: 8px;
      }

      .logo span {
        display: none;
      }

      .back-link {
        padding: 6px 8px;
        font-size: 13px;
      }

      .action-btn {
        min-width: auto;
        padding: 7px 10px;
      }

      .article-title {
        font-size: clamp(30px, 9vw, 38px);
      }

      .article-summary {
        font-size: 18px;
      }

      .tut-text {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="/community">
        <img src="assets/app_logo/favicon.png" alt="Dreaming Polar">
        <span>Dreaming Polar</span>
      </a>
      <a class="back-link" href="/community"><i class="ti ti-arrow-left"></i> 返回社区</a>
      <div class="author-inline" id="top-author"></div>
      <div class="like-wrap">
        <button class="action-btn" id="like-btn" type="button"><i class="ti ti-heart"></i><span id="like-btn-label">点赞</span></button>
        <button class="action-btn" id="fav-btn" type="button"><i class="ti ti-bookmark"></i>收藏</button>
      </div>
    </div>
  </header>

  <main class="page">
    <article class="article">
      <h1 class="article-title" id="article-title">加载中...</h1>
      <p class="article-summary" id="article-summary"></p>
      <div class="article-meta" id="article-meta"></div>
      <img class="article-cover" id="article-cover" alt="封面">
      <section class="block-list" id="tutorial-content"></section>
    </article>

    <aside class="sidebar">
      <section class="card">
        <h3>作者信息</h3>
        <div class="author-card-head">
          <div class="avatar" id="author-avatar"></div>
          <div>
            <div class="author-name" id="author-name">匿名作者</div>
            <div style="font-size:12px;color:#7587a1;" id="author-role">创作者</div>
          </div>
        </div>
        <p class="author-bio" id="author-bio">这位作者还没有填写简介。</p>
      </section>

      <section class="card">
        <h3>相关教程</h3>
        <div class="related-list" id="related-list">
          <div class="empty-state">正在加载相关教程...</div>
        </div>
      </section>
    </aside>
  </main>

  <section class="comments">
    <h2>评论</h2>
    <div class="comment-form">
      <textarea id="comment-input" placeholder="写下你的想法..." aria-label="评论输入"></textarea>
      <div class="comments-actions">
        <div class="status-text" id="comment-status"></div>
        <button class="action-btn" id="comment-submit" type="button"><i class="ti ti-message-circle"></i>发表评论</button>
      </div>
    </div>
    <div class="comment-list" id="comment-list"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script type="module" src="/components/compiler/compiler.js"></script>
  <script>
    const API_BASE = 'https://api.dreamingpolar.com/auth';
    const id = location.pathname.split('/community/')[1];
    if (!id) location.href = '/community';

    const state = {
      tutorial: null,
      blocks: [],
      liked: false,
      likeCount: 0,
      comments: [],
      related: [],
      compiler: null,
      runningBlocks: new Set(),
      tokenCache: '',
    };

    const els = {
      title: document.getElementById('article-title'),
      summary: document.getElementById('article-summary'),
      meta: document.getElementById('article-meta'),
      cover: document.getElementById('article-cover'),
      content: document.getElementById('tutorial-content'),
      topAuthor: document.getElementById('top-author'),
      likeBtn: document.getElementById('like-btn'),
      likeBtnLabel: document.getElementById('like-btn-label'),
      favBtn: document.getElementById('fav-btn'),
      authorAvatar: document.getElementById('author-avatar'),
      authorName: document.getElementById('author-name'),
      authorRole: document.getElementById('author-role'),
      authorBio: document.getElementById('author-bio'),
      relatedList: document.getElementById('related-list'),
      commentInput: document.getElementById('comment-input'),
      commentSubmit: document.getElementById('comment-submit'),
      commentStatus: document.getElementById('comment-status'),
      commentList: document.getElementById('comment-list'),
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function text(value, fallback = '') {
      const s = String(value ?? '').trim();
      return s || fallback;
    }

    function initials(name = '') {
      const normalized = String(name).trim();
      if (!normalized) return 'DP';
      const parts = normalized.split(/\s+/).filter(Boolean);
      if (parts.length > 1) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return normalized.slice(0, 2).toUpperCase();
    }

    function formatTime(v) {
      if (!v) return '';
      const date = new Date(v);
      if (Number.isNaN(date.getTime())) return String(v);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function getTokenFromCookie() {
      const m = document.cookie.match(/(?:^|;\s*)accessToken=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    }

    function getDpAccessCookie() {
      const m = document.cookie.match(/(?:^|;\s*)dp_access=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    }

    function getTokenFromLocalStorage() {
      try {
        const auth = JSON.parse(localStorage.getItem('dp_auth') || '{}');
        if (auth?.accessToken) return auth.accessToken;
      } catch (_) {}
      return localStorage.getItem('token') || '';
    }

    function getToken() {
      const fromClient = window.authClient?.getAccessToken?.();
      if (fromClient) return fromClient;
      if (state.tokenCache) return state.tokenCache;
      return getTokenFromCookie() || getDpAccessCookie() || getTokenFromLocalStorage();
    }

    async function ensureToken() {
      const token = getToken();
      if (token) {
        state.tokenCache = token;
        return token;
      }
      try {
        await fetch('https://api.dreamingpolar.com/auth/refresh', { method: 'POST', credentials: 'include' });
      } catch (_) {}
      const refreshed = getToken();
      if (refreshed) {
        state.tokenCache = refreshed;
        return refreshed;
      }
      throw new Error('请先登录');
    }

    async function request(url, options = {}) {
      const opts = {
        credentials: 'include',
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      };

      if (!opts.skipAuth) {
        const token = getToken();
        if (token) opts.headers.Authorization = `Bearer ${token}`;
      }

      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data?.message || `请求失败: ${res.status}`);
      }
      return data;
    }

    function normalizeBlocks(blocks) {
      if (!Array.isArray(blocks)) return [];
      return blocks.map((block) => {
        const code = block.code ?? block.content ?? '';
        return {
          ...block,
          type: block.type || 'text',
          content: block.content ?? '',
          code,
          language: block.language || 'python',
          executable: block.executable !== false,
          level: Number(block.level || 2),
          variant: block.variant || 'info',
          imageUrl: block.imageUrl || block.url || '',
          caption: block.caption || '',
        };
      });
    }

    function likeFlag(raw) {
      return Boolean(
        raw?.liked_by_me ||
        raw?.is_liked ||
        raw?.liked ||
        raw?.likedByMe ||
        raw?.viewer_has_liked
      );
    }

    function getLikeCount(raw) {
      const n = raw?.likes_count ?? raw?.like_count ?? raw?.likes ?? 0;
      return Number.isFinite(Number(n)) ? Number(n) : 0;
    }

    function authorOf(tutorial) {
      const a = tutorial?.author || tutorial?.user || tutorial?.creator || {};
      return {
        username: text(a.username || tutorial?.author_username, ''),
        name: text(a.name || a.username || tutorial?.author_name, '匿名作者'),
        avatar: text(a.avatar || a.avatar_url || a.photo || tutorial?.author_avatar, ''),
        bio: text(a.bio || tutorial?.author_bio, '这位作者还没有填写简介。'),
        role: text(a.role || a.title || tutorial?.author_role, '创作者'),
        id: a.id || tutorial?.author_id || '',
      };
    }

    function renderTopAndSidebar() {
      const tutorial = state.tutorial || {};
      const author = authorOf(tutorial);
      const profileHref = author.username ? `/community/user/${encodeURIComponent(author.username)}` : '#';

      els.title.textContent = text(tutorial.title, '未命名教程');
      els.summary.textContent = text(tutorial.summary, '');
      els.summary.style.display = els.summary.textContent ? '' : 'none';

      const tags = Array.isArray(tutorial.tags) ? tutorial.tags.filter(Boolean) : [];
      const metaBits = [
        text(tutorial.read_time || tutorial.reading_time, ''),
        formatTime(tutorial.created_at || tutorial.createdAt || tutorial.updated_at),
      ].filter(Boolean);

      els.meta.innerHTML = `
        <a class="author-link" href="${profileHref}">
          <div class="avatar">${author.avatar ? `<img src="${escapeHtml(author.avatar)}" alt="${escapeHtml(author.name)}">` : escapeHtml(initials(author.name))}</div>
          <span>${escapeHtml(author.name)}</span>
        </a>
        ${metaBits.length ? `<span>·</span><span>${escapeHtml(metaBits.join(' · '))}</span>` : ''}
        ${tags.length ? `<span>·</span><span>${tags.map(t => `#${t}`).join(' ')}</span>` : ''}
      `;

      if (tutorial.cover_image) {
        els.cover.src = tutorial.cover_image;
        els.cover.style.display = '';
      } else {
        els.cover.style.display = 'none';
      }

      els.topAuthor.innerHTML = `
        <a class="author-link" href="${profileHref}">
          <div class="avatar">${author.avatar ? `<img src="${escapeHtml(author.avatar)}" alt="${escapeHtml(author.name)}">` : escapeHtml(initials(author.name))}</div>
          <span>${escapeHtml(author.name)}</span>
        </a>
      `;

      if (author.avatar) {
        els.authorAvatar.innerHTML = `<a class="author-link" href="${profileHref}"><img src="${escapeHtml(author.avatar)}" alt="${escapeHtml(author.name)}"></a>`;
      } else {
        els.authorAvatar.innerHTML = `<a class="author-link" href="${profileHref}">${escapeHtml(initials(author.name))}</a>`;
      }
      els.authorName.innerHTML = `<a class="author-link" href="${profileHref}">${escapeHtml(author.name)}</a>`;
      els.authorRole.textContent = author.role;
      els.authorBio.textContent = author.bio;

      renderLikeButton();
    }

    function headingLevel(v) {
      const n = Number(v || 2);
      return [2, 3, 4].includes(n) ? n : 2;
    }

    function iconByVariant(variant) {
      if (variant === 'tip') return 'bulb';
      if (variant === 'warning') return 'alert-triangle';
      return 'info-circle';
    }

    function blockHtml(block, index) {
      if (block.type === 'text') {
        return `<div class="tut-text">${marked.parse(block.content || '')}</div>`;
      }

      if (block.type === 'code') {
        const rawCode = block.code || block.content || '';
        return `
          <div class="tut-code" data-block-index="${index}">
            <div class="code-header">
              <span class="lang-badge">${escapeHtml(block.language || 'text')}</span>
              ${block.executable ? `<button class="run-btn" data-run-index="${index}">▶ 运行</button>` : ''}
            </div>
            <pre><code>${escapeHtml(rawCode)}</code></pre>
            <div class="code-output" data-output-index="${index}" style="display:none"></div>
          </div>
        `;
      }

      if (block.type === 'latex') {
        return `<div class="tut-latex">$$${escapeHtml(block.content || '')}$$</div>`;
      }

      if (block.type === 'heading') {
        const level = headingLevel(block.level);
        return `<h${level} class="tut-heading">${escapeHtml(block.content || '')}</h${level}>`;
      }

      if (block.type === 'image') {
        return `
          <figure class="tut-image">
            <img src="${escapeHtml(block.imageUrl || '')}" alt="${escapeHtml(block.caption || '')}">
            ${block.caption ? `<figcaption>${escapeHtml(block.caption)}</figcaption>` : ''}
          </figure>
        `;
      }

      if (block.type === 'callout') {
        const variant = ['tip', 'warning', 'info'].includes(block.variant) ? block.variant : 'info';
        return `
          <div class="tut-callout tut-callout--${variant}">
            <i class="ti ti-${iconByVariant(variant)}"></i>
            <span>${escapeHtml(block.content || '')}</span>
          </div>
        `;
      }

      return `<div class="tut-text">${escapeHtml(JSON.stringify(block))}</div>`;
    }

    function renderBlocks() {
      if (!state.blocks.length) {
        els.content.innerHTML = '<div class="empty-state">该教程还没有内容。</div>';
        return;
      }

      els.content.innerHTML = state.blocks.map((block, index) => blockHtml(block, index)).join('');

      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise([els.content]).catch(() => {});
      }
    }

    function renderLikeButton() {
      els.likeBtn.classList.toggle('liked', state.liked);
      els.likeBtnLabel.textContent = state.liked ? `已点赞${state.likeCount ? ` · ${state.likeCount}` : ''}` : `点赞${state.likeCount ? ` · ${state.likeCount}` : ''}`;
      els.likeBtn.innerHTML = `${state.liked ? '<i class="ti ti-heart-filled"></i>' : '<i class="ti ti-heart"></i>'}<span id="like-btn-label">${escapeHtml(els.likeBtnLabel.textContent)}</span>`;
      els.likeBtnLabel = document.getElementById('like-btn-label');
    }

    function renderRelated() {
      if (!state.related.length) {
        els.relatedList.innerHTML = '<div class="empty-state">暂无相关教程。</div>';
        return;
      }

      els.relatedList.innerHTML = state.related.map((item) => {
        const title = text(item.title, '未命名教程');
        const author = authorOf(item).name;
        const href = `/community/${encodeURIComponent(item.id || item._id || '')}`;
        return `
          <a class="related-item" href="${href}">
            <p class="related-title">${escapeHtml(title)}</p>
            <p class="related-meta">${escapeHtml(author)}</p>
          </a>
        `;
      }).join('');
    }

    function commentAuthor(comment) {
      const user = comment?.user || comment?.author || {};
      return {
        name: text(user.name || user.username || comment?.username, '匿名用户'),
        avatar: text(user.avatar || user.avatar_url || comment?.avatar, ''),
      };
    }

    function renderComments() {
      if (!state.comments.length) {
        els.commentList.innerHTML = '<div class="empty-state">还没有评论，来抢个沙发吧。</div>';
        return;
      }

      els.commentList.innerHTML = state.comments.map((comment) => {
        const user = commentAuthor(comment);
        const content = text(comment.content, '');
        return `
          <article class="comment-item">
            <div class="comment-head">
              <div class="comment-user">
                <div class="avatar">${user.avatar ? `<img src="${escapeHtml(user.avatar)}" alt="${escapeHtml(user.name)}">` : escapeHtml(initials(user.name))}</div>
                <span class="comment-name">${escapeHtml(user.name)}</span>
              </div>
              <time class="comment-time">${escapeHtml(formatTime(comment.created_at || comment.createdAt))}</time>
            </div>
            <div class="comment-content">${escapeHtml(content)}</div>
          </article>
        `;
      }).join('');
    }

    function setCommentStatus(message, isError = false) {
      els.commentStatus.textContent = message || '';
      els.commentStatus.style.color = isError ? '#b42318' : '#667085';
    }

    async function ensureCompiler() {
      if (state.compiler) return state.compiler;
      state.compiler = await import('/components/compiler/compiler.js');
      return state.compiler;
    }

    function flattenCompileOutput(output = []) {
      return output.map((item) => {
        if (item.type === 'text' || item.type === 'info') return item.content || '';
        if (item.type === 'error') return `Error: ${item.content || ''}`;
        if (item.type === 'html') return item.content || '';
        if (item.type === 'latex') return item.content || '';
        if (item.type === 'image') return '[image output]';
        return JSON.stringify(item);
      }).join('\n').trim();
    }

    async function runCodeBlock(index, button) {
      const block = state.blocks[index];
      if (!block || state.runningBlocks.has(index)) return;

      const outputEl = els.content.querySelector(`[data-output-index="${index}"]`);
      if (!outputEl) return;

      state.runningBlocks.add(index);
      const original = button.textContent;
      button.disabled = true;
      button.textContent = '运行中...';
      outputEl.style.display = 'block';
      outputEl.textContent = '运行中...';

      try {
        if (typeof window.injectDataFrame === 'function') {
          try {
            window.injectDataFrame({});
          } catch (_) {}
        }

        const compiler = await ensureCompiler();
        const result = await compiler.compile(String(block.code || block.content || ''), 'python');
        const output = flattenCompileOutput(result);
        outputEl.textContent = output || 'Executed (no output).';
      } catch (err) {
        outputEl.textContent = `执行失败: ${err.message}`;
      } finally {
        state.runningBlocks.delete(index);
        button.disabled = false;
        button.textContent = original;
      }
    }

    async function toggleLike() {
      try {
        const token = await ensureToken();
        const method = state.liked ? 'DELETE' : 'POST';
        const res = await fetch(`${API_BASE}/tutorials/${id}/like`, {
          method,
          credentials: 'include',
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.message || '点赞操作失败');

        state.liked = !state.liked;
        if (typeof data?.liked === 'boolean') state.liked = data.liked;
        if (Number.isFinite(Number(data?.likes_count))) {
          state.likeCount = Number(data.likes_count);
        } else {
          state.likeCount = Math.max(0, state.likeCount + (state.liked ? 1 : -1));
        }

        renderLikeButton();
      } catch (err) {
        alert(err.message || '请先登录后操作');
      }
    }

    async function loadTutorial() {
      const data = await request(`${API_BASE}/tutorials/${id}`);
      const tutorial = data?.tutorial || data?.data || data;
      state.tutorial = tutorial || {};
      state.blocks = normalizeBlocks(state.tutorial.blocks);
      state.liked = likeFlag(state.tutorial);
      state.likeCount = getLikeCount(state.tutorial);

      renderTopAndSidebar();
      renderBlocks();
    }

    async function loadRelated() {
      try {
        const data = await request(`${API_BASE}/tutorials`, { skipAuth: true });
        const list = Array.isArray(data?.tutorials) ? data.tutorials : (Array.isArray(data?.data) ? data.data : (Array.isArray(data) ? data : []));
        const currentAuthor = authorOf(state.tutorial).id;
        state.related = list
          .filter(item => (item.id || item._id) !== id)
          .filter(item => !currentAuthor || authorOf(item).id === currentAuthor)
          .slice(0, 4);

        if (!state.related.length) {
          state.related = list.filter(item => (item.id || item._id) !== id).slice(0, 4);
        }
        renderRelated();
      } catch (_) {
        els.relatedList.innerHTML = '<div class="empty-state">相关教程加载失败。</div>';
      }
    }

    async function loadComments() {
      try {
        const data = await request(`${API_BASE}/tutorials/${id}/comments`, { skipAuth: true });
        const list = Array.isArray(data?.comments) ? data.comments : (Array.isArray(data?.data) ? data.data : (Array.isArray(data) ? data : []));
        state.comments = list;
        renderComments();
      } catch (_) {
        els.commentList.innerHTML = '<div class="empty-state">评论加载失败。</div>';
      }
    }

    async function submitComment() {
      const content = els.commentInput.value.trim();
      if (!content) {
        setCommentStatus('评论内容不能为空', true);
        return;
      }

      els.commentSubmit.disabled = true;
      setCommentStatus('正在发布...');

      try {
        const token = await ensureToken();
        await fetch(`${API_BASE}/tutorials/${id}/comments`, {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ content }),
        }).then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data?.message || '发表评论失败');
        });

        els.commentInput.value = '';
        setCommentStatus('评论已发布');
        await loadComments();
      } catch (err) {
        setCommentStatus(err.message || '请先登录后评论', true);
      } finally {
        els.commentSubmit.disabled = false;
      }
    }

    function bindEvents() {
      els.content.addEventListener('click', (e) => {
        const runBtn = e.target.closest('.run-btn');
        if (!runBtn) return;
        const index = Number(runBtn.dataset.runIndex);
        if (!Number.isFinite(index)) return;
        runCodeBlock(index, runBtn);
      });

      els.likeBtn.addEventListener('click', toggleLike);
      els.favBtn.addEventListener('click', () => {
        alert('收藏功能即将上线');
      });
      els.commentSubmit.addEventListener('click', submitComment);
    }

    async function boot() {
      bindEvents();
      try {
        await loadTutorial();
        await Promise.all([loadRelated(), loadComments()]);
      } catch (err) {
        document.querySelector('.page').outerHTML = `<div class="error-box">加载教程失败：${escapeHtml(err.message || '未知错误')}</div>`;
        document.querySelector('.comments').style.display = 'none';
      }
    }

    boot();
  </script>
</body>
</html>
